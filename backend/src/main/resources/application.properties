spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/esport_portal}
spring.datasource.username=${POSTGRES_USER:esport_user}
spring.datasource.password=${POSTGRES_PASSWORD:esport_password}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Circuit Breaker - PandaScore
resilience4j.circuitbreaker.instances.pandascore.slidingWindowSize=10
resilience4j.circuitbreaker.instances.pandascore.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.pandascore.failureRateThreshold=50
resilience4j.circuitbreaker.instances.pandascore.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.pandascore.permittedNumberOfCallsInHalfOpenState=2
